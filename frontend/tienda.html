<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitrina — Hydra Systems</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── CSS Custom Properties ─────────────────────────────── */
    :root {
      /* Will be overridden dynamically by tienda.js */
      --brand-primary:    #00F0FF;
      --brand-dim:        rgba(0, 240, 255, 0.12);
      --brand-glow:       rgba(0, 240, 255, 0.28);
      --brand-border:     rgba(0, 240, 255, 0.25);

      --bg-void:   #080C15;
      --bg-space:  #0F172A;
      --bg-card:   rgba(15, 23, 42, 0.70);
      --white:     #F8FAFC;
      --muted:     #94A3B8;
      --danger:    #F87171;
      --success:   #34D399;

      --font-head: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-void);
      color:            var(--white);
      font-family:      var(--font-body);
      overflow-x:       hidden;
    }

    /* ── Navbar ────────────────────────────────────────────── */
    .store-nav {
      position:        sticky;
      top:             0;
      z-index:         100;
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      padding:         1rem 2rem;
      backdrop-filter: blur(16px);
      background:      rgba(8,12,21,.80);
      border-bottom:   1px solid var(--brand-border);
    }

    .store-logo {
      display:         flex;
      align-items:     center;
      gap:             .75rem;
    }

    .store-logo img {
      width:         40px;
      height:        40px;
      border-radius: 8px;
      object-fit:    cover;
      border:        2px solid var(--brand-primary);
    }

    .store-logo-placeholder {
      width:           40px;
      height:          40px;
      border-radius:   8px;
      background:      var(--brand-dim);
      border:          2px solid var(--brand-primary);
      display:         flex;
      align-items:     center;
      justify-content: center;
      font-size:       1.25rem;
    }

    .store-name {
      font-family:   var(--font-head);
      font-size:     1.25rem;
      font-weight:   800;
      color:         var(--brand-primary);
      text-shadow:   0 0 16px var(--brand-glow);
      letter-spacing: -0.03em;
    }

    .cart-toggle-btn {
      display:         flex;
      align-items:     center;
      gap:             .5rem;
      padding:         .5rem 1.25rem;
      background:      var(--brand-dim);
      border:          1px solid var(--brand-border);
      border-radius:   8px;
      color:           var(--brand-primary);
      font-family:     var(--font-head);
      font-size:       .875rem;
      font-weight:     700;
      cursor:          pointer;
      transition:      all .2s;
    }
    .cart-toggle-btn:hover { background: var(--brand-dim); box-shadow: 0 0 16px var(--brand-glow); }

    .cart-badge {
      background:    var(--brand-primary);
      color:         var(--bg-void);
      border-radius: 99px;
      padding:       .1rem .5rem;
      font-size:     .75rem;
      font-weight:   800;
      min-width:     20px;
      text-align:    center;
    }

    /* ── Hero Banner ───────────────────────────────────────── */
    .store-hero {
      padding:         4rem 2rem 3rem;
      text-align:      center;
      border-bottom:   1px solid var(--brand-border);
      position:        relative;
      overflow:        hidden;
    }

    .store-hero::before {
      content:    '';
      position:   absolute;
      top:        -50%;
      left:       50%;
      transform:  translateX(-50%);
      width:      600px;
      height:     600px;
      background: radial-gradient(circle, var(--brand-glow), transparent 60%);
      pointer-events: none;
    }

    .store-hero h1 {
      font-family:   var(--font-head);
      font-size:     clamp(2rem, 5vw, 3.5rem);
      font-weight:   800;
      letter-spacing: -0.04em;
      color:         var(--brand-primary);
      text-shadow:   0 0 32px var(--brand-glow);
      margin-bottom: .75rem;
      position:      relative;
    }

    .store-hero p {
      color:     var(--muted);
      font-size: 1.0625rem;
      position:  relative;
    }

    /* ── Product Grid ──────────────────────────────────────── */
    .products-section {
      padding: 3rem 2rem;
      max-width: 1200px;
      margin:  0 auto;
    }

    .products-header {
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      margin-bottom:   2rem;
    }

    .products-header h2 {
      font-family:   var(--font-head);
      font-size:     1.25rem;
      font-weight:   700;
    }

    .products-count {
      font-size: .875rem;
      color:     var(--muted);
    }

    .products-grid {
      display:               grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap:                   1.5rem;
    }

    /* ── Product Card ──────────────────────────────────────── */
    .product-card {
      background:      var(--bg-card);
      border:          1px solid var(--brand-border);
      border-radius:   14px;
      overflow:        hidden;
      backdrop-filter: blur(12px);
      transition:      transform .25s, box-shadow .25s, border-color .25s;
      display:         flex;
      flex-direction:  column;
    }

    .product-card:hover {
      transform:    translateY(-4px);
      box-shadow:   0 0 24px var(--brand-glow);
      border-color: var(--brand-primary);
    }

    .product-img {
      position:   relative;
      aspect-ratio: 1 / 1;
      background: var(--bg-space);
      overflow:   hidden;
    }

    .product-img img {
      width:      100%;
      height:     100%;
      object-fit: cover;
      transition: transform .4s;
    }

    .product-card:hover .product-img img { transform: scale(1.04); }

    .product-img-placeholder {
      width:           100%;
      height:          100%;
      display:         flex;
      align-items:     center;
      justify-content: center;
      font-size:       4rem;
      background:      linear-gradient(135deg, var(--bg-space), var(--bg-void));
      color:           var(--muted);
    }

    .stock-chip {
      position:      absolute;
      top:           .625rem;
      right:         .625rem;
      padding:       .2rem .6rem;
      border-radius: 99px;
      font-size:     .7rem;
      font-weight:   700;
    }

    .stock-chip.low  { background: rgba(248,113,113,.2); border: 1px solid rgba(248,113,113,.4); color: var(--danger); }
    .stock-chip.ok   { background: rgba(52,211,153,.15); border: 1px solid rgba(52,211,153,.3); color: var(--success); }

    .product-info {
      padding: 1.125rem;
      flex:    1;
      display: flex;
      flex-direction: column;
    }

    .product-info h3 {
      font-family:   var(--font-head);
      font-size:     .9375rem;
      font-weight:   700;
      margin-bottom: .375rem;
      line-height:   1.3;
    }

    .product-info .desc {
      font-size:     .8rem;
      color:         var(--muted);
      line-height:   1.5;
      margin-bottom: auto;
      flex:          1;
      display:       -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:      hidden;
    }

    .product-footer {
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      margin-top:      1rem;
    }

    .product-price {
      font-family: var(--font-head);
      font-size:   1.25rem;
      font-weight: 800;
      color:       var(--brand-primary);
      text-shadow: 0 0 10px var(--brand-glow);
    }

    .btn-add-cart {
      padding:       .5rem 1rem;
      background:    var(--brand-primary);
      color:         var(--bg-void);
      border:        none;
      border-radius: 7px;
      font-family:   var(--font-head);
      font-size:     .8125rem;
      font-weight:   700;
      cursor:        pointer;
      transition:    transform .2s, box-shadow .2s;
      box-shadow:    0 0 10px var(--brand-glow);
    }
    .btn-add-cart:hover   { transform: translateY(-1px); box-shadow: 0 0 20px var(--brand-glow); }
    .btn-add-cart:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* ── Empty / Error states ──────────────────────────────── */
    .state-container {
      padding:    5rem 2rem;
      text-align: center;
      color:      var(--muted);
    }
    .state-icon { font-size: 4rem; margin-bottom: 1.5rem; display: block; opacity: .6; }
    .state-container h2 { font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; color: var(--white); margin-bottom: .75rem; }
    .state-container p  { font-size: 1rem; max-width: 400px; margin: 0 auto; }

    /* ── Cart Drawer ───────────────────────────────────────── */
    .cart-overlay {
      position:   fixed;
      inset:      0;
      background: rgba(8,12,21,.6);
      z-index:    150;
      opacity:    0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .cart-overlay.open { opacity: 1; pointer-events: all; }

    .cart-drawer {
      position:   fixed;
      top:        0;
      right:      0;
      height:     100vh;
      width:      min(420px, 100vw);
      background: var(--bg-space);
      border-left: 1px solid var(--brand-border);
      z-index:    160;
      display:    flex;
      flex-direction: column;
      transform:  translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      box-shadow: -4px 0 40px rgba(0,0,0,.5);
    }
    .cart-drawer.open { transform: translateX(0); }

    .cart-header {
      padding:       1.25rem 1.5rem;
      border-bottom: 1px solid var(--brand-border);
      display:       flex;
      align-items:   center;
      justify-content: space-between;
    }

    .cart-header h2 {
      font-family: var(--font-head);
      font-size:   1.125rem;
      font-weight: 700;
    }

    .cart-close {
      background:    transparent;
      border:        none;
      color:         var(--muted);
      font-size:     1.5rem;
      cursor:        pointer;
      line-height:   1;
      padding:       .25rem;
      transition:    color .2s;
    }
    .cart-close:hover { color: var(--white); }

    .cart-items {
      flex:       1;
      overflow-y: auto;
      padding:    1rem 1.5rem;
    }

    .cart-item {
      display:       flex;
      gap:           .875rem;
      padding:       .875rem 0;
      border-bottom: 1px solid rgba(0,240,255,.07);
      align-items:   flex-start;
    }
    .cart-item:last-child { border-bottom: none; }

    .cart-item-img {
      width:         56px;
      height:        56px;
      border-radius: 8px;
      object-fit:    cover;
      background:    var(--bg-void);
      border:        1px solid var(--brand-border);
      flex-shrink:   0;
    }

    .cart-item-img-ph {
      width:         56px;
      height:        56px;
      border-radius: 8px;
      background:    var(--bg-void);
      border:        1px solid var(--brand-border);
      display:       flex;
      align-items:   center;
      justify-content: center;
      font-size:     1.5rem;
      flex-shrink:   0;
    }

    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: .875rem; font-weight: 600; line-height: 1.3; margin-bottom: .25rem; }
    .cart-item-price { font-size: .8rem; color: var(--muted); }

    .cart-item-controls {
      display:     flex;
      align-items: center;
      gap:         .5rem;
      margin-top:  .5rem;
    }

    .qty-btn {
      width:         26px;
      height:        26px;
      border-radius: 5px;
      background:    var(--brand-dim);
      border:        1px solid var(--brand-border);
      color:         var(--brand-primary);
      font-size:     1rem;
      font-weight:   700;
      cursor:        pointer;
      display:       flex;
      align-items:   center;
      justify-content: center;
      transition:    background .2s;
    }
    .qty-btn:hover { background: rgba(0,240,255,.25); }

    .qty-value { font-family: var(--font-head); font-size: .875rem; font-weight: 700; min-width: 24px; text-align: center; }

    .cart-item-subtotal {
      font-family: var(--font-head);
      font-size:   .875rem;
      font-weight: 700;
      color:       var(--brand-primary);
      white-space: nowrap;
      padding-top: .125rem;
    }

    .cart-remove {
      background:    transparent;
      border:        none;
      color:         var(--muted);
      cursor:        pointer;
      font-size:     1rem;
      padding:       .25rem;
      transition:    color .2s;
    }
    .cart-remove:hover { color: var(--danger); }

    /* ── Cart Footer ──────────────────────────────────────── */
    .cart-footer {
      padding:    1.25rem 1.5rem;
      border-top: 1px solid var(--brand-border);
    }

    .cart-summary {
      margin-bottom: 1.25rem;
    }

    .cart-row {
      display:         flex;
      justify-content: space-between;
      font-size:       .875rem;
      padding:         .3rem 0;
      color:           var(--muted);
    }

    .cart-row.total {
      color:       var(--white);
      font-family: var(--font-head);
      font-size:   1.125rem;
      font-weight: 800;
      border-top:  1px solid var(--brand-border);
      margin-top:  .5rem;
      padding-top: .75rem;
    }

    .cart-row.total .total-val { color: var(--brand-primary); text-shadow: 0 0 10px var(--brand-glow); }

    .btn-checkout {
      width:       100%;
      padding:     .875rem;
      background:  var(--brand-primary);
      color:       var(--bg-void);
      border:      none;
      border-radius: 10px;
      font-family: var(--font-head);
      font-size:   1rem;
      font-weight: 700;
      cursor:      pointer;
      transition:  transform .2s, box-shadow .2s;
      box-shadow:  0 0 20px var(--brand-glow);
    }
    .btn-checkout:hover    { transform: translateY(-1px); box-shadow: 0 0 32px var(--brand-glow); }
    .btn-checkout:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .cart-empty {
      flex:            1;
      display:         flex;
      flex-direction:  column;
      align-items:     center;
      justify-content: center;
      color:           var(--muted);
      text-align:      center;
      padding:         2rem;
      gap:             1rem;
    }
    .cart-empty .icon { font-size: 3rem; opacity: .4; }

    /* ── Payment result banner ─────────────────────────────── */
    .payment-banner {
      margin:        2rem auto;
      max-width:     600px;
      padding:       2rem;
      border-radius: 16px;
      text-align:    center;
    }
    .payment-banner.success { background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.3); }
    .payment-banner.error   { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.3); }
    .payment-banner .icon   { font-size: 3rem; margin-bottom: 1rem; display: block; }
    .payment-banner h2      { font-family: var(--font-head); font-size: 1.5rem; font-weight: 800; margin-bottom: .5rem; }
    .payment-banner .detail { font-size: .875rem; color: var(--muted); margin-top: 1rem; }

    /* ── Spinner ───────────────────────────────────────────── */
    .page-spinner {
      display:         flex;
      align-items:     center;
      justify-content: center;
      min-height:      60vh;
      flex-direction:  column;
      gap:             1rem;
      color:           var(--muted);
    }

    .spinner-ring {
      width:         48px;
      height:        48px;
      border:        4px solid var(--brand-dim);
      border-top-color: var(--brand-primary);
      border-radius: 50%;
      animation:     spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ────────────────────────────────────────────── */
    .store-footer {
      margin-top:  4rem;
      padding:     2rem;
      text-align:  center;
      border-top:  1px solid var(--brand-border);
      font-size:   .8rem;
      color:       var(--muted);
    }
    .store-footer a { color: var(--brand-primary); text-decoration: none; }
  </style>
</head>
<body>

  <!-- ── Navbar ────────────────────────────────────────────── -->
  <nav class="store-nav">
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <a href="directorio.html" style="color: var(--muted); text-decoration: none; font-size: 0.875rem; display: flex; align-items: center; gap: 0.25rem; transition: color 0.2s;" onmouseover="this.style.color='var(--white)'" onmouseout="this.style.color='var(--muted)'">
        <span>←</span> Directorio
      </a>
      <div class="store-logo">
        <div class="store-logo-placeholder" id="storeLogoPlaceholder">🏪</div>
        <img id="storeLogoImg" src="" alt="" style="display:none;" />
        <span class="store-name" id="storeNameHeader">Cargando...</span>
      </div>
    </div>
    <button class="cart-toggle-btn" onclick="toggleCart()">
      🛒 Carrito <span class="cart-badge" id="cartCount">0</span>
    </button>
  </nav>

  <!-- ── Main Content ──────────────────────────────────────── -->
  <main id="storeMain">
    <div class="page-spinner" id="loadingState">
      <div class="spinner-ring"></div>
      <span>Cargando tienda...</span>
    </div>
  </main>

  <!-- ── Cart Overlay + Drawer ─────────────────────────────── -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>

  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>🛒 Tu carrito</h2>
      <button class="cart-close" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter" style="display:none;">
      
      <!-- Checkout Form -->
      <div id="checkoutForm" style="display:none; border-top: 1px solid var(--brand-border); padding-top: 1rem; margin-top: 1rem;">
        <h3 style="font-size: 1rem; margin-bottom: 1rem;">📍 Datos de Envío</h3>
        <div style="display: grid; gap: 0.75rem; margin-bottom: 1rem;">
          <input type="text" id="chk_nombre" placeholder="Nombre completo" required style="width: 100%; padding: 0.5rem; background: rgba(15,23,42,.9); border: 1px solid var(--brand-border); border-radius: 6px; color: white;" />
          <input type="email" id="chk_email" placeholder="Email" required style="width: 100%; padding: 0.5rem; background: rgba(15,23,42,.9); border: 1px solid var(--brand-border); border-radius: 6px; color: white;" />
          <input type="tel" id="chk_telefono" placeholder="Teléfono" required style="width: 100%; padding: 0.5rem; background: rgba(15,23,42,.9); border: 1px solid var(--brand-border); border-radius: 6px; color: white;" />
          <input type="text" id="chk_region" placeholder="Región" required style="width: 100%; padding: 0.5rem; background: rgba(15,23,42,.9); border: 1px solid var(--brand-border); border-radius: 6px; color: white;" />
          <input type="text" id="chk_ciudad" placeholder="Ciudad" required style="width: 100%; padding: 0.5rem; background: rgba(15,23,42,.9); border: 1px solid var(--brand-border); border-radius: 6px; color: white;" />
          <input type="text" id="chk_comuna" placeholder="Comuna" required style="width: 100%; padding: 0.5rem; background: rgba(15,23,42,.9); border: 1px solid var(--brand-border); border-radius: 6px; color: white;" />
          <input type="text" id="chk_direccion" placeholder="Dirección completa" required style="width: 100%; padding: 0.5rem; background: rgba(15,23,42,.9); border: 1px solid var(--brand-border); border-radius: 6px; color: white;" />
        </div>
      </div>

      <div class="cart-summary" id="cartSummary"></div>
      
      <button class="btn-checkout" id="startCheckoutBtn" onclick="showCheckoutForm()">
        Continuar al pago
      </button>
      <button class="btn-checkout" id="checkoutBtn" onclick="checkout()" style="display:none;">
        Pagar con Webpay Plus
      </button>
    </div>
  </div>

  <script src="tienda.js"></script>
</body>
</html>
