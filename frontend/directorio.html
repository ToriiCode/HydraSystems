<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directorio de Tiendas — Hydra Systems</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-void:       #080C15;
      --bg-space:      #0F172A;
      --bg-card:       rgba(15, 23, 42, 0.60);
      --cyan:          #00F0FF;
      --cyan-dim:      rgba(0, 240, 255, 0.15);
      --cyan-glow:     rgba(0, 240, 255, 0.30);
      --electric:      #38BDF8;
      --white:         #F8FAFC;
      --muted:         #94A3B8;
      --border-neon:   rgba(0, 240, 255, 0.25);
      --font-head:     'Space Grotesk', sans-serif;
      --font-body:     'Inter', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-void);
      color:            var(--white);
      font-family:      var(--font-body);
      min-height:       100vh;
      display:          flex;
      flex-direction:   column;
    }

    /* ── Navigation ────────────────────────────────────────── */
    nav {
      position:        sticky;
      top:             0;
      z-index:         100;
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      padding:         1rem 2rem;
      backdrop-filter: blur(16px);
      background:      rgba(8, 12, 21, 0.75);
      border-bottom:   1px solid var(--border-neon);
    }

    .nav-logo {
      font-family:   var(--font-head);
      font-size:     1.5rem;
      font-weight:   800;
      letter-spacing: -0.03em;
      color:          var(--cyan);
      text-shadow:    0 0 24px var(--cyan-glow);
      text-decoration: none;
    }
    .nav-logo span { color: var(--white); }

    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: color .2s; }
    .nav-links a:hover { color: var(--white); }

    /* ── Header ────────────────────────────────────────────── */
    .header {
      padding: 4rem 2rem;
      text-align: center;
      background: radial-gradient(circle at 50% -50%, var(--cyan-dim), transparent 70%);
    }

    .header h1 {
      font-family: var(--font-head);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .header p {
      color: var(--muted);
      font-size: 1.125rem;
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    .search-container {
      max-width: 500px;
      margin: 0 auto;
      position: relative;
    }

    .search-container input {
      width: 100%;
      padding: 1rem 1.5rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-neon);
      border-radius: 99px;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
    }

    .search-container input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 30px var(--cyan-glow);
    }

    /* ── Stores Grid ───────────────────────────────────────── */
    .stores-container {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      flex: 1;
      width: 100%;
    }

    .stores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .store-card {
      background: var(--bg-card);
      border: 1px solid var(--border-neon);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--white);
    }

    .store-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 32px var(--cyan-glow);
      border-color: var(--cyan);
    }

    .store-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .store-logo-ph {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      border: 2px solid;
      background: rgba(15, 23, 42, 0.5);
    }

    .store-info { flex: 1; overflow: hidden; }
    
    .store-info h3 {
      font-family: var(--font-head);
      font-size: 1.125rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .store-info p {
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .store-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .stat-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
    }

    .visit-btn {
      font-family: var(--font-head);
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--cyan);
      transition: color 0.2s;
    }
    
    .store-card:hover .visit-btn { color: var(--electric); text-shadow: 0 0 8px var(--cyan-glow); }

    /* ── Loader ────────────────────────────────────────────── */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      color: var(--muted);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--cyan-dim);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Hydra<span>Systems</span></a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="admin.html">Mi Panel</a>
    </div>
  </nav>

  <header class="header">
    <h1>Explora la Red Hydra</h1>
    <p>Descubre cientos de tiendas únicas impulsadas por nuestra tecnología.</p>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Buscar por nombre o rubro..." oninput="onSearch()" />
    </div>
  </header>

  <main class="stores-container">
    <div id="storesGrid" class="stores-grid">
      <div class="loader">
        <div class="spinner"></div>
        <p>Cargando tiendas...</p>
      </div>
    </div>
  </main>

  <script>
    const API = 'http://localhost:3000/api';
    let searchTimer = null;

    async function loadStores(search = '') {
      const grid = document.getElementById('storesGrid');
      
      try {
        const url = search ? `${API}/stores/public?search=${encodeURIComponent(search)}` : `${API}/stores/public`;
        const resp = await fetch(url);
        const data = await resp.json();

        if (!resp.ok || !data.success) throw new Error(data.error);

        if (data.data.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--muted);">
              <div style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;">🔍</div>
              <h3>No se encontraron tiendas</h3>
              <p>Intenta con otros términos de búsqueda.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = data.data.map(store => {
          const color = store.color_hex || '#00F0FF';
          return `
            <a href="tienda.html?tienda=${store.slug}" class="store-card" style="border-top-color: ${color};">
              <div class="store-header">
                <div class="store-logo-ph" style="border-color: ${color}; color: ${color};">
                  ${store.logo_url ? `<img src="${esc(store.logo_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;" />` : '🏪'}
                </div>
                <div class="store-info">
                  <h3 style="color: ${color}; text-shadow: 0 0 8px ${color}40;">${esc(store.nombre)}</h3>
                  <p>/${esc(store.slug)}</p>
                </div>
              </div>
              <div class="store-stats">
                <span class="stat-badge">${store.total_productos} productos</span>
                <span class="visit-btn" style="color: ${color};">Visitar →</span>
              </div>
            </a>
          `;
        }).join('');

      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#F87171;">Error al cargar: ${err.message}</div>`;
      }
    }

    function onSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        loadStores(document.getElementById('searchInput').value.trim());
      }, 350);
    }

    function esc(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => loadStores());
  </script>
</body>
</html>
